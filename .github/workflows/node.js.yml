# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build/test verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# The default shell for a `run:` block is `bash -e {0}` -- which is *not*
# `pipefail`, so a pipeline reports only its last command's status and a failure
# anywhere earlier is swallowed. That is not academic here: `git show
# <sha>:package.json | jq -r .version` returns an empty string and exit 0 when
# the lookup fails, because `jq` is perfectly happy with empty input. An empty
# version then compares unequal to everything, which is how a *failed read*
# turns into "the version changed" -- silently disabling the `version` job's
# checks, or moving the `release` tag that every host deploys.
#
# Naming `bash` explicitly is what GitHub documents as `bash --noprofile --norc
# -eo pipefail {0}`, so this closes the whole class rather than the three places
# it had reached. Any pipeline whose failure is expected now has to say so with
# an explicit `|| true`, which is the right way round.
defaults:
  run:
    shell: bash

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run validate
    - run: npm run build

  # The MariaDB stores, against a real MariaDB. `npm run validate` skips these
  # (no SCAMPER_TEST_DATABASE_URL), because an ordinary checkout should not need
  # a database to run the tests -- but the SQL that actually ships is worth
  # exercising somewhere, and per-user scoping is not something the in-memory
  # stores can vouch for.
  database-tests:

    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: scamper_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npx vitest run test/server/mariadb-stores.test.ts
      env:
        SCAMPER_TEST_DATABASE_URL: mysql://root:test@127.0.0.1:3306/scamper_test
        # Deliberately not UTC. DATETIME carries no zone, so a server whose
        # clock is not UTC is exactly where stored times go wrong -- and a
        # runner in UTC would never notice.
        TZ: America/Chicago

  browser-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run test:browser

  # The compose stack, end to end, on the code in this branch.
  #
  # Everything above tests pieces: `build` never starts a server, and
  # `database-tests` exercises our own SQL rather than BetterAuth's. Nothing
  # else runs `better-auth migrate` at all -- which matters, because the
  # migration comes from the copy of `better-auth` bundled inside
  # @better-auth/cli rather than from the one the server imports, and those two
  # are different versions (docs/dependencies.md). A bump that the typechecker
  # is happy with can still leave a server whose schema its own migration tool
  # cannot produce, and nobody able to sign in.
  #
  # So this asks the only question that catches that: after a real `compose up`,
  # can an administrator make an account, and can its owner sign in and keep a
  # file?
  server-smoke:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Values, not secrets: this stack is built, asked three questions, and
    # thrown away. BETTER_AUTH_URL has to match the origin curl uses below, port
    # included, or sign-in is refused as an invalid origin.
    #
    # SCAMPER_TAG is deliberately a name CI never publishes, so compose builds
    # this branch instead of pulling a ghcr image that has nothing to do with
    # it.
    - name: Write a .env for the stack
      run: |
        cat > .env <<'ENV'
        MARIADB_DATABASE=scamper
        MARIADB_USER=scamper
        MARIADB_PASSWORD=smoketestpassword
        MARIADB_ROOT_PASSWORD=smoketestrootpassword
        BETTER_AUTH_SECRET=smoke-test-secret-not-used-anywhere-else
        BETTER_AUTH_URL=http://localhost:8080
        SCAMPER_TAG=smoke
        WEB_PORT=8080
        SERVER_PORT=3000
        ENV

    - name: Bring the stack up
      run: docker compose up -d --build

    # Through `web` (Caddy), not the API's own port: that is the origin a
    # student's browser uses, and the one the session cookie is scoped to.
    #
    # `server` waits on `migrate` completing successfully, so a migration that
    # fails shows up here as a server that never answers -- hence the log dump,
    # which is where the reason will be.
    - name: Wait for it to answer
      run: |
        for _ in $(seq 1 60); do
          if curl -fsS http://localhost:8080/api/v1/health | grep -q '"status":"ok"'; then
            echo "The stack is up."
            exit 0
          fi
          sleep 5
        done
        echo "::error::the stack never became healthy"
        docker compose logs --no-color migrate server web db
        exit 1

    # The only way an account is ever made -- there is no sign-up route. This is
    # `internalAdapter.createUser` and `createAccount`, which is exactly what a
    # BetterAuth upgrade changes out from under us.
    - name: Make an account
      run: |
        scripts/server/user-add smoke@example.edu "Smoke Test" > /tmp/user-add.log
        password="$(awk '/^  password: /{ print $2 }' /tmp/user-add.log)"
        if [ -z "${password}" ]; then
          echo "::error::user-add printed no password"
          cat /tmp/user-add.log
          exit 1
        fi
        # This account lives for about twenty seconds and the stack is thrown
        # away after it, so the password is not worth protecting -- but it is
        # printed by user-add and carried in every later step's environment,
        # and this file should not teach anyone to leave one in a log.
        echo "::add-mask::${password}"
        echo "SMOKE_PASSWORD=${password}" >> "${GITHUB_ENV}"

    # The half a schema change breaks silently: 1.7 filters credential sign-in
    # on a column 1.6 never wrote, so this is green on either version alone and
    # red on a half-applied upgrade.
    - name: Sign in
      run: |
        status="$(curl -sS -o /tmp/sign-in.json -w '%{http_code}' \
          -c /tmp/cookies.txt \
          -H 'Content-Type: application/json' \
          -H 'Origin: http://localhost:8080' \
          -d "{\"email\":\"smoke@example.edu\",\"password\":\"${SMOKE_PASSWORD}\"}" \
          http://localhost:8080/api/auth/sign-in/email)"
        if [ "${status}" != "200" ]; then
          echo "::error::sign-in answered ${status}"
          cat /tmp/sign-in.json
          docker compose logs --no-color server
          exit 1
        fi
        if ! grep -q 'better-auth.session_token' /tmp/cookies.txt; then
          echo "::error::sign-in set no session cookie"
          exit 1
        fi

    # That the session actually authorises the file routes, and that a file
    # survives the round trip through MariaDB.
    - name: Save a file and read it back
      run: |
        printf '(+ 1 2)\n' > /tmp/smoke.scm

        curl -fsS -b /tmp/cookies.txt -X PUT \
          -H 'Content-Type: application/octet-stream' \
          --data-binary @/tmp/smoke.scm \
          http://localhost:8080/api/v1/fs/files/smoke.scm

        curl -fsS -b /tmp/cookies.txt \
          http://localhost:8080/api/v1/fs/files/smoke.scm > /tmp/read-back.scm
        diff /tmp/smoke.scm /tmp/read-back.scm

        curl -fsS -b /tmp/cookies.txt http://localhost:8080/api/v1/fs/files \
          | grep -q 'smoke.scm'

    # The other half of the same guarantee: without the cookie these are
    # nobody's files. A server that answered this 200 would be serving one
    # student's work to another.
    - name: Refuse the same request without a session
      run: |
        status="$(curl -sS -o /dev/null -w '%{http_code}' \
          http://localhost:8080/api/v1/fs/files)"
        if [ "${status}" != "401" ]; then
          echo "::error::an unauthenticated file listing answered ${status}, not 401"
          exit 1
        fi

    - name: Show the logs when something above failed
      if: failure()
      run: docker compose logs --no-color

    - name: Tear it down
      if: always()
      run: docker compose down -v

  # The three images a deployment runs, pushed to ghcr.io. A server pulls these
  # rather than building its own: the front-end build (`npm ci` plus Vite) is
  # the memory-hungriest step in this repository, and a small managed host runs
  # out of memory part way through it -- while a runner has memory to spare and
  # builds x86 natively.
  #
  # `needs` is the point as much as the build is. What this pushes is what a
  # server pulls, so it only publishes from a main whose tests passed.
  publish:

    if: github.event_name == 'push'
    needs: [build, database-tests, browser-tests, server-smoke]

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          # `target` matters: server/Dockerfile's *last* stage is `migrate`, so
          # an untargeted build would publish the migration CLI as the server.
          - image: web
            dockerfile: Dockerfile.web
            target: runtime
          - image: server
            dockerfile: server/Dockerfile
            target: runtime
          - image: migrate
            dockerfile: server/Dockerfile
            target: migrate

    steps:
    - uses: actions/checkout@v4
      with:
        # HEAD^ has to be here. Whether this commit is a release is whether it
        # changed the version, and that is a question about its parent.
        fetch-depth: 2
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # What this build is called. Every commit gets `latest` and its own SHA; a
    # commit that changes the version in package.json also gets that version and
    # moves `release`.
    #
    # `release` is the one a server follows, and that is the whole point: an
    # ordinary merge reaches nobody, and a version bump is what students get --
    # so the version in the IDE, the patch notes it shows, and the code behind
    # them agree. See .env.example.
    #
    # `github.repository` is lowercase, as ghcr.io requires.
    - id: meta
      run: |
        image="ghcr.io/${{ github.repository }}-${{ matrix.image }}"
        version="$(jq -r .version package.json)"

        # Whether this commit is a release is whether it changed the version,
        # so a parent that cannot be read means the question cannot be answered
        # -- and answering it wrongly moves `release`, which every host on
        # SCAMPER_TAG=release then deploys.
        #
        # The old `git show HEAD^:… | jq … || echo none` could not fail: jq
        # exits 0 on empty input, so the fallback never ran and `previous` came
        # back empty, which compares unequal to `version` and tags the commit as
        # a release. `pipefail` (see `defaults`) makes that pipeline fail now,
        # but the fallback would still say `none` and still look like a release,
        # so the two cases are told apart explicitly instead.
        if ! git rev-parse --verify --quiet HEAD^ >/dev/null; then
          # Genuinely no parent: the repository's first commit is a release.
          previous=none
        elif ! previous_json="$(git show HEAD^:package.json)"; then
          echo "::error::could not read package.json at HEAD^ -- refusing to guess whether this is a release"
          exit 1
        else
          previous="$(printf '%s' "${previous_json}" | jq -r .version)"
        fi
        {
          echo "tags<<EOF"
          echo "${image}:latest"
          echo "${image}:${GITHUB_SHA}"
          if [ "${version}" != "${previous}" ]; then
            echo "${image}:${version}"
            echo "${image}:release"
          fi
          echo "EOF"
          echo "version=${version}"
        } >> "${GITHUB_OUTPUT}"
        if [ "${version}" != "${previous}" ]; then
          echo "Releasing ${version} (was ${previous})." >> "${GITHUB_STEP_SUMMARY}"
        fi

    - uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        target: ${{ matrix.target }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        # So `docker image inspect` can say which version a floating tag is
        # currently pointing at:
        #
        #   docker image inspect ghcr.io/slag-plt/scamper-web:release \
        #     -f '{{index .Config.Labels "org.opencontainers.image.version"}}'
        labels: |
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
        # Scoped per image: they share no layers worth confusing, and one cache
        # for all three would evict itself on every run.
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # A version bump is a release: it decides what a server deploys, what students
  # see in the corner of the IDE, and which patch notes they are shown. So a
  # pull request that changes it has to change everything a release needs --
  # which is easy to half-do and hard to notice afterwards.
  #
  # Silent on the pull requests that are not releases, which is nearly all of
  # them. Make it a required status check on main to make it binding; see
  # docs/releasing.md.
  version:

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: A version bump must be a whole one
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        head="$(jq -r .version package.json)"

        # Read separately, then parse. `git show … | jq` would report only jq's
        # status, and jq exits 0 on empty input -- so a failed lookup would give
        # an empty `base` that compares unequal to everything, announcing a
        # release that is not one and, worse, quietly passing the "version rose"
        # check below against nothing. `pipefail` (see `defaults` above) makes
        # that loud; this makes it legible.
        if ! base_json="$(git show "${BASE_SHA}:package.json")"; then
          echo "::error::could not read package.json at ${BASE_SHA} -- nothing can be checked against it"
          exit 1
        fi
        base="$(printf '%s' "${base_json}" | jq -r .version)"

        if [ "${base}" = "${head}" ]; then
          echo "No version change here; nothing to check."
          exit 0
        fi

        # A release candidate previews a release: 4.4.0-rc.2 is a preview of
        # 4.4.0, and every check below is about that release rather than about
        # the candidate. See docs/releasing.md.
        release="${head%%-*}"

        echo "This pull request releases ${base} -> ${release}."
        if [ "${head}" != "${release}" ]; then
          echo "Currently previewing it as ${head}."
        fi
        failed=0

        workspace="$(jq -r .version server/package.json)"
        if [ "${workspace}" != "${head}" ]; then
          echo "::error file=server/package.json::still ${workspace}, not ${head}"
          failed=1
        fi

        # `npm version` writes the lockfile too, in two places. A version
        # changed by hand leaves them behind, and `npm ci` would then install a
        # tree that disagrees with the manifest it came from.
        for lock in $(jq -r '.version, .packages[""].version' package-lock.json); do
          if [ "${lock}" != "${head}" ]; then
            echo "::error file=package-lock.json::still ${lock}, not ${head} -- run npm version rather than editing by hand"
            failed=1
          fi
        done

        # On the release versions, not the literal ones: `sort -V` orders
        # 4.4.0 *before* 4.4.0-rc.1, which is backwards from semver, and the
        # question here is only whether the release being cut is newer.
        if [ "${base}" = "${release}" ] ||
           [ "$(printf '%s\n%s\n' "${base}" "${release}" | sort -V | tail -1)" != "${release}" ]; then
          echo "::error file=package.json::${release} is not newer than ${base}"
          failed=1
        fi

        # A patch release may pass without notes -- a bug fix does not deserve a
        # modal in front of every student. A minor or major one changes what
        # Scamper does, which is what patch notes are for.
        #
        # Notes accumulate under a `next` entry, so in practice this catches a
        # release that bumped the version and forgot to rename it: the notes are
        # written but still filed under a version no student will ever run.
        # Matched the way the parser reads it (leading '#', whitespace, the
        # version, nothing else), rather than as an exact line, so a heading
        # the IDE is perfectly happy with cannot fail here. The dots are
        # escaped so they are not regex wildcards.
        release_re="$(printf '%s' "${release}" | sed 's/\./\\./g')"
        if [ "$(echo "${release}" | cut -d. -f3)" = "0" ] &&
           ! grep -qE "^#[[:space:]]+${release_re}[[:space:]]*$" patch-notes.md; then
          echo "::error file=patch-notes.md::no patch notes for ${release} -- rename the '# next' heading to '# ${release}' (and leave a fresh empty one behind), or students get ${release} with nothing said about it"
          failed=1
        fi

        # Last, so the report above is a full rehearsal of the release before
        # this says it is not one yet. A candidate is a preview: it is built and
        # published (see the `preview` job) but must not reach main, or the
        # images, the version in the IDE, and the notes would disagree.
        if [ "${head}" != "${release}" ]; then
          echo "::error file=package.json::${head} is a release candidate, so this cannot merge yet -- everything else above is checked, and setting the version to ${release} is what releases it"
          failed=1
        fi

        exit "${failed}"

  # Whether this commit changes the version, which is the only thing that
  # publishes a preview. Split out from `preview` below, and deliberately
  # outside its concurrency group: a run that publishes nothing must not be
  # able to sit in that group, because a later arrival cancels a *pending*
  # member rather than queueing behind it -- which would cancel the release
  # preview on behalf of an unrelated pull request.
  preview-check:

    runs-on: ubuntu-latest

    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
    - uses: actions/checkout@v4
      with:
        # HEAD^ for the push case: whether this commit is a version change is a
        # question about its parent.
        fetch-depth: 2
        persist-credentials: false

    - id: version
      name: Is this a version change?
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        head="$(jq -r .version package.json)"

        # The blob is read before jq sees it, rather than `git show … | jq`.
        # jq exits 0 on empty input, so a failed lookup in a pipeline is
        # silent: `base` would come back empty, compare unequal to `head`, and
        # publish -- pruning the release actually under review on behalf of a
        # pull request that changed no version at all.
        if [ "${EVENT}" = "pull_request" ]; then
          if ! base_json="$(git show "${BASE_SHA}:package.json" 2>/dev/null)"; then
            echo "::error::could not read package.json at ${BASE_SHA}"
            exit 1
          fi
        else
          # An unborn parent is the repository's first commit, not an error.
          base_json="$(git show 'HEAD^:package.json' 2>/dev/null || echo '{}')"
        fi
        base="$(printf '%s' "${base_json}" | jq -r '.version // "none"')"

        if [ "${head}" = "${base}" ]; then
          echo "The version is unchanged; there is no preview to publish."
          echo "publish=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        echo "Publishing a preview of ${head}."
        {
          echo "publish=true"
          echo "version=${head}"
          # Everything belonging to this release survives the prune below.
          echo "release=${head%%-*}"
        } >> "${GITHUB_OUTPUT}"

  # A version pull request publishes a client-side-only build of itself, so a
  # release can be opened and clicked around before it exists (#565). Scamper
  # used to get this for free: it was a purely static app and `scripts/deploy`
  # gave every release its own directory. The live app is server-backed now, so
  # this puts the preview somewhere else -- GitHub Pages -- rather than beside
  # it.
  #
  # Client-side only is not a special build: the IDE keeps files in the browser
  # unless it can fetch a `config.json` naming a server, and none is served
  # here. So a preview is the ordinary bundle, and anything needing the back end
  # -- signing in, server file storage, history -- is simply absent from it.
  preview:

    needs: [build, preview-check]

    # A fork's GITHUB_TOKEN is read-only however this job asks for `contents:
    # write`, so publishing from one would fail at the push with a misleading
    # red X. Skipped instead: `preview` is not a required check, so nothing is
    # blocked by its absence.
    if: >-
      needs.preview-check.outputs.publish == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    # One branch, and every publishing run pushes to it. Not
    # cancel-in-progress: a half-finished push would leave the site
    # inconsistent.
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4
      with:
        # This job runs the pull request's own code (`npm ci` postinstall, the
        # build). It also holds a token that can push, so that token is kept
        # out of the checkout's git config and used only where it is needed.
        persist-credentials: false

    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - run: npm ci

    # `--base` is what makes a subdirectory deploy work: every asset URL in the
    # bundle is written with this prefix. scripts/build forwards it to both
    # Vite builds. Through `env` rather than `${{ }}` interpolation, since the
    # version is a value the pull request itself controls.
    - name: Build it for the subdirectory it will live in
      env:
        VERSION: ${{ needs.preview-check.outputs.version }}
      run: npm run build -- --base="/${GITHUB_REPOSITORY##*/}/${VERSION}/"

    - name: Publish it to gh-pages
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.preview-check.outputs.version }}
        RELEASE: ${{ needs.preview-check.outputs.release }}
      run: |
        set -euo pipefail
        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        # Cloned rather than checked out, so the build in ./dist is untouched.
        # The branch is made here on the first run rather than by hand, so this
        # needs no setup beyond turning Pages on.
        if git clone --quiet --depth=1 --branch gh-pages "${remote}" pages 2>/dev/null; then
          echo "Publishing onto the existing gh-pages."
        else
          echo "No gh-pages yet; starting one."
          mkdir pages
          git -C pages init --quiet
        fi

        cd pages
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # The site is a preview, not an archive: it holds the release under
        # review and nothing else. A directory belongs to this release when its
        # name matches once an -rc suffix is stripped, so the candidates for one
        # release stay side by side and the whole set is cleared the moment the
        # next release starts. The live app is where a shipped release is looked
        # at, so nothing of value is dropped here.
        find . -maxdepth 1 -mindepth 1 -type d -not -name '.git' -printf '%f\n' |
          while read -r dir; do
            if [ "${dir%%-*}" != "${RELEASE}" ]; then
              echo "Removing ${dir}, which is not part of ${RELEASE}."
              rm -rf "./${dir}"
            fi
          done

        rm -rf "./${VERSION}"
        cp -r ../dist "./${VERSION}"

        # Pages would otherwise treat this as a Jekyll site and drop anything
        # whose name begins with an underscore.
        touch .nojekyll

        # A listing, so the root of the site is not a 404. Releases first, then
        # their candidates newest-first -- `sort -V` puts 4.4.0 before
        # 4.4.0-rc.1, which is backwards, so the two are gathered separately.
        #
        # Gathered before the document is written, and with `|| true`: a `grep`
        # that matches nothing exits 1, and "no release directory yet" is the
        # normal state while a candidate is under review, not an error.
        dirs="$(find . -maxdepth 1 -mindepth 1 -type d -not -name '.git' -printf '%f\n')"
        releases="$(printf '%s\n' "${dirs}" | grep -v -e '-' | sort -Vr || true)"
        candidates="$(printf '%s\n' "${dirs}" | grep -e '-' | sort -Vr || true)"

        {
          echo '<!doctype html>'
          echo '<html lang="en"><head><meta charset="utf-8">'
          echo '<meta name="viewport" content="width=device-width,initial-scale=1">'
          echo "<title>Scamper ${RELEASE} previews</title>"
          echo '<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;line-height:1.5}li{margin:.25rem 0}</style>'
          echo '</head><body>'
          echo "<h1>Scamper ${RELEASE} previews</h1>"
          echo '<p>Client-side only builds, for looking at a release before it ships.'
          echo 'Files are kept in your browser: signing in, server storage, and history are not part of a preview.</p>'
          echo '<ul>'
          for dir in ${releases}; do
            echo "<li><a href=\"${dir}/\">${dir}</a> &mdash; the release</li>"
          done
          for dir in ${candidates}; do
            echo "<li><a href=\"${dir}/\">${dir}</a></li>"
          done
          echo '</ul>'
          echo "<p><a href=\"https://github.com/${GITHUB_REPOSITORY}\">github.com/${GITHUB_REPOSITORY}</a></p>"
          echo '</body></html>'
        } > index.html

        # One orphan commit, force-pushed, rather than a growing history. Each
        # build is several megabytes and its asset names carry the version, so
        # almost nothing would dedupe between commits; keeping every past
        # preview forever would work against the Pages source-size limit and
        # every clone of the repository. The site's *content* is what matters
        # here, and the prune above has already decided what that is.
        if git rev-parse --verify --quiet HEAD >/dev/null; then
          git checkout --quiet --orphan publish
        else
          git checkout --quiet -b publish
        fi
        git add -A
        git commit --quiet -m "Preview ${VERSION} (${GITHUB_SHA})"
        git push --quiet --force "${remote}" publish:gh-pages

        pages_host="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]').github.io"
        echo "Preview published: https://${pages_host}/${GITHUB_REPOSITORY##*/}/${VERSION}/" \
          >> "${GITHUB_STEP_SUMMARY}"

    # One comment per pull request, edited in place, so re-cutting a candidate
    # does not add another.
    - name: Say where it is
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.preview-check.outputs.version }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        pages_host="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]').github.io"
        url="https://${pages_host}/${GITHUB_REPOSITORY##*/}/${VERSION}/"
        marker="<!-- scamper-preview -->"

        body="$(printf '%s\n**Preview:** %s\n\nA client-side-only build of `%s`. Files are kept in your browser — signing in, server storage, and history are not part of a preview.\n\nTo publish another, re-cut the candidate with `npm version prerelease --workspaces --include-workspace-root --no-git-tag-version`; this comment follows the newest one. See docs/releasing.md.' \
          "${marker}" "${url}" "${VERSION}")"

        # --paginate: the comment is normally the first, but a long review
        # would push it off page one and each re-cut would then add another
        # rather than editing this one.
        # Read fully, then take the first line: piping gh straight into `head`
        # closes its output early, and the SIGPIPE that follows is a failed
        # pipeline under pipefail.
        found="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
          --jq "map(select(.body | startswith(\"${marker}\"))) | .[0].id // empty")"
        existing="$(printf '%s\n' "${found}" | head -n 1)"

        if [ -n "${existing}" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="${body}" --silent
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" --silent
        fi
