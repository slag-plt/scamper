<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Search Functions &middot; Scamper</title>
  <!--
    Search is part of the docs page now (#403). This stays as a redirect because
    search.html is linked from older builds, course materials and bookmarks.

    location.replace('docs.html' + (location.search || '?search='))
  </script>
</head>
<body>
  <p>Redirecting to the <a href="docs.html?search=">documentation search</a>.</p>
</body>
</html>
